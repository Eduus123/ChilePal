<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>

    Chilepal — Registro

  </title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    href="
      https://fonts.googleapis.com/css2?
      family=Playfair+Display:wght@600;700&
      family=DM+Sans:wght@300;400;500;600&
      display=swap
    "
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="/static/style.css"
  >

</head>

<body class="login-body">

<div
  class="login-container"
  style="max-width:460px"
>

  <div class="login-brand">

    <span class="login-icon">

      🥑

    </span>

    <h1 class="login-title">

      Crear cuenta

    </h1>

    <p class="login-sub">

      Accede al catálogo de Chilepal

    </p>

  </div>

  

  {% with messages = get_flashed_messages() %}

    {% if messages %}

      {% for msg in messages %}

        <div class="flash-msg">

          {{ msg }}

        </div>

      {% endfor %}

    {% endif %}

  {% endwith %}

  

  <form

    class="login-form"

    method="POST"

    action="/registro"
  >

    <div class="form-group">

      <label>

        Nombre completo

      </label>

      <input
        type="text"
        name="nombre"
        required
        placeholder="Juan Pérez"
      >

    </div>

    <div class="form-group">

      <label>

        Correo electrónico

      </label>

      <input
        type="email"
        name="email"
        required
        placeholder="correo@ejemplo.cl"
      >

    </div>

    

    <div class="form-group">

      <label>

        Teléfono

      </label>

      <input
        type="text"
        name="telefono"
        required
        placeholder="+56 9 1234 5678"
      >

    </div>

    <div class="form-group">

      <label>

        Ciudad

      </label>

      <input
        type="text"
        name="ciudad"
        required
        placeholder="Santiago"
      >

    </div>

    <div class="form-group">

      <label>

        Dirección

      </label>

      <input
        type="text"
        name="direccion"
        placeholder="Av. Ejemplo 123"
      >

    </div>

    

    <div class="form-group">

      <label>

        Contraseña

      </label>

      <input
        type="password"
        name="password"
        required
        placeholder="••••••••"
      >

    </div>

    <button
      type="submit"
      class="btn-primary btn-full"
    >

      Crear cuenta

    </button>

  </form>

  

  <p class="login-register">

    ¿Ya tienes cuenta?

    <a href="/login">

      Inicia sesión

    </a>

  </p>

</div>

</body>

</html>
